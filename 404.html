<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found | Parth Patel</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0a0e27">

    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="icon" href="/favicon.ico" sizes="any">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Bricolage+Grotesque:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/style.css">
    <style>
        .not-found {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1rem;
        }

        .not-found-code {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(4rem, 15vw, 8rem);
            font-weight: 700;
            line-height: 1;
            margin-bottom: 1rem;
        }

        .not-found p {
            color: var(--text-secondary);
            margin: 1rem 0 2rem;
        }
    </style>
</head>
<body>
    <div class="bg-gradient" aria-hidden="true"></div>

    <main class="not-found">
        <div>
            <div class="not-found-code gradient-text">404</div>
            <h1>Page not found</h1>
            <p>The page you're looking for doesn't exist or has moved.</p>
            <a href="/" class="btn btn-primary">Back to home</a>
        </div>
    </main>
</body>
</html>
